version: 2

models:
  - name: stg_drivers
    columns:
      - name: driver_id
        data_tests: [unique, not_null]

  - name: stg_constructors
    columns:
      - name: constructor_id
        data_tests: [unique, not_null]

  - name: stg_races
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]

  - name: stg_race_results
    columns:
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_constructors')
                field: constructor_id
      - name: is_classified
        data_tests: [not_null]
      - name: session_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['race']

  - name: stg_sprint_results
    columns:
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_constructors')
                field: constructor_id
      - name: is_classified
        data_tests: [not_null]
      - name: session_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['sprint']