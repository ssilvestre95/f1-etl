name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-db
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -v
